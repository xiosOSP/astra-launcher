<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: app://shots app://worlds https://cdn.modrinth.com https://skinsystem.ely.by https://ely.by; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AstraLauncher</title>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/refresh.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="frame cut">
        <div class="frame-inner">
          <div class="brand" id="brand"></div>
          <nav class="nav" id="nav" aria-label="Разделы"></nav>
          <p class="sidebar-tip" id="tip"></p>
          <div id="update-slot"></div>
          <button class="player" id="player" title="Сменить ник" aria-haspopup="menu" aria-expanded="false"></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="titlebar">
        <button class="game-pill" id="game-pill" hidden title="Открыть лог игры"></button>
        <button class="friend-chip" id="friend-chip" hidden title="Скопировать адрес для друга"></button>
        <div class="titlebar-spacer"></div>
        <button class="win-btn" id="btn-shortcuts" title="Горячие клавиши (F1)" aria-label="Горячие клавиши"></button>
        <button class="win-btn" id="btn-log" title="Лог игры"></button>
        <span class="titlebar-sep"></span>
        <button class="win-btn" id="btn-min" title="Свернуть"></button>
        <button class="win-btn" id="btn-max" title="Развернуть"></button>
        <button class="win-btn close" id="btn-close" title="Закрыть"></button>
      </header>
      <div class="view" id="view"><div class="view-inner" id="view-inner"></div></div>
    </main>
  </div>

  <section class="drawer" id="drawer" aria-label="Лог игры">
    <div class="drawer-head">
      <h3>Лог игры</h3>
      <button class="btn sm ghost" id="log-copy"></button>
      <button class="btn sm ghost" id="log-folder"></button>
      <button class="btn sm btn-icon ghost" id="log-close" title="Скрыть"></button>
    </div>
    <pre class="log" id="log"></pre>
  </section>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
