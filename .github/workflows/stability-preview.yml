name: Stability and UI preview

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'dev/capture-ui.cjs'
      - '.github/workflows/stability-preview.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Settings and shortcut regression tests
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check src/main/main.js
          node --check src/main/modpacks.js
          node --check src/main/accounts.js
          node --check src/renderer/js/pages/content.js
          node --check dev/capture-ui.cjs
      - name: Render AstraLauncher with Electron
        run: xvfb-run -a node dev/capture-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-interface-preview
          path: docs/screenshots/*.png
          if-no-files-found: warn
      - name: Commit preview screenshots to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture latest AstraLauncher interface"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
