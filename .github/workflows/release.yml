# Сборка и публикация релиза. Когда в main меняется версия в package.json,
# GitHub собирает portable-версию на Windows и выкладывает релиз vX.Y.Z
# (или vX.Y.Z-vN для небольших обновлений «X.Y.Z [VN]»)
# вместе с update.json (по нему лаунчер находит и проверяет обновление).
# Если релиз этой версии уже есть — ничего не делает.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Версия и проверка, что такого релиза ещё нет
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          L=$(node -p "require('./src/main/appversion').label(require('./package.json').version)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "label=$L" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз v$V уже есть — пропускаю"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.ver.outputs.skip == 'false'

      - name: Тесты перед выпуском
        if: steps.ver.outputs.skip == 'false'
        run: node --test tests/*.test.cjs

      - name: Проверка синтаксиса перед выпуском
        if: steps.ver.outputs.skip == 'false'
        run: |
          node --check src/main/main.js
          node --check src/main/accounts.js
          node --check src/main/modpacks.js
          node --check src/renderer/js/pages/content.js

      - name: Сборка
        if: steps.ver.outputs.skip == 'false'
        run: npx electron-builder --win portable --x64 --publish never

      - name: update.json
        if: steps.ver.outputs.skip == 'false'
        run: node dev/release.js

      - name: Описание релиза из CHANGELOG.md
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          L="${{ steps.ver.outputs.label }}"
          awk -v v="## $L" '$0 == v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AstraLauncher ${{ steps.ver.outputs.label }}
          body_path: notes.md
          files: |
            dist/AstraLauncher-Portable-*.exe
            dist/update.json
